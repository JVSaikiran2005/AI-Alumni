version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: alumniconnect_db
    environment:
      POSTGRES_DB: alumniconnect_db
      POSTGRES_USER: alumniconnect
      POSTGRES_PASSWORD: alumni_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumniconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: alumniconnect_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: development
      DATABASE_URL: postgresql://alumniconnect:alumni_password@db:5432/alumniconnect_db
      JWT_SECRET_KEY: your-secret-key-change-in-production
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    command: python app.py

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: alumniconnect_frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    command: npm run dev

volumes:
  postgres_data:

networks:
  default:
    name: alumniconnect-network
